name: Terraform Apply

on:
  push:
    branches:
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-development-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: environments/development/terraform.tfstate
  TF_VAR_aws_region: us-east-1
  TF_VAR_owner: ${{ vars.TF_OWNER }}

jobs:
  apply:
    name: Plan and Apply
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inspect OIDC claims
        shell: bash
        run: |
          ID_TOKEN="$(curl --silent --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq --raw-output '.value')"

          ID_TOKEN="${ID_TOKEN}" python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "repository_owner": claims.get("repository_owner"),
              "ref": claims.get("ref"),
              "environment": claims.get("environment"),
              "event_name": claims.get("event_name")
          }, indent=2))
          PY

      - name: Validate workflow configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "Missing repository variable: AWS_ROLE_ARN"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "Missing repository variable: TF_STATE_BUCKET"; exit 1; }
          test -n "$TF_VAR_owner" || { echo "Missing repository variable: TF_OWNER"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        run: |
          terraform -chdir=terraform/environments/development init \
            -reconfigure \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=terraform/environments/development validate -no-color

      - name: Create reviewed-state plan
        run: |
          terraform -chdir=terraform/environments/development plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out=tfplan

      - name: Publish apply plan summary
        run: |
          {
            echo "### Terraform development apply plan"
            echo '```text'
            terraform -chdir=terraform/environments/development show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Terraform plan
        run: |
          terraform -chdir=terraform/environments/development apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan
