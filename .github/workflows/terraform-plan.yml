name: Terraform Plan

on:
  pull_request:
    branches:
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-development-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: environments/development/terraform.tfstate
  TF_VAR_aws_region: us-east-1
  TF_VAR_owner: ${{ vars.TF_OWNER }}

jobs:
  plan:
    name: Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate workflow configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "Missing repository variable: AWS_ROLE_ARN"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "Missing repository variable: TF_STATE_BUCKET"; exit 1; }
          test -n "$TF_VAR_owner" || { echo "Missing repository variable: TF_OWNER"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        run: |
          terraform -chdir=terraform/environments/development init \
            -reconfigure \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=terraform/environments/development validate -no-color

      - name: Create Terraform plan
        run: |
          terraform -chdir=terraform/environments/development plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out=tfplan

      - name: Publish plan summary
        run: |
          {
            echo "### Terraform development plan"
            echo '```text'
            terraform -chdir=terraform/environments/development show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
